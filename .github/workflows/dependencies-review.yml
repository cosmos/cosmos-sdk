name: "Dependency Review"
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: depot-ubuntu-22.04-4
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
      - name: "Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - name: "Dependency Review"
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fail-on-severity: high
      - name: "Dependency audit"
        run: ./scripts/dep-assert.sh
      - name: "Go vulnerability check"
        id: govuln
        run: |
          # Known vulnerabilities that are accepted rather than fixed:
          #   GO-2025-3443 - golang.org/x/crypto/ssh, pre-existing allowance
          #   GO-2026-5932 - golang.org/x/crypto/openpgp, no fix exists as the
          #                  package is unmaintained by design
          ALLOWED_VULNS="GO-2025-3443 GO-2026-5932"

          # Run the vulnerability check and capture its output (ignoring non-zero exit codes)
          make vulncheck 2>&1 | tee govulncheck-output.txt || true

          # Make sure govulncheck actually ran; otherwise an install or build failure
          # would leave an empty report and pass this check vacuously.
          if ! grep -qE 'No vulnerabilities found|Your code is affected by' govulncheck-output.txt; then
            echo "govulncheck did not produce a report, see the output above; failing..."
            exit 1
          fi

          # Extract vulnerability identifiers from the output (e.g., GO-2025-3443)
          vulnerabilities=$(grep -o 'GO-[0-9]\{4\}-[0-9]\+' govulncheck-output.txt | sort | uniq)
          echo "Detected vulnerabilities: $vulnerabilities"

          # Fail on any vulnerability that is not in the allow list above
          for vuln in $vulnerabilities; do
            case " $ALLOWED_VULNS " in
              *" $vuln "*) ;;
              *) echo "Found vulnerability $vuln, failing..."; exit 1 ;;
            esac
          done

          echo "Only known vulnerabilities ($ALLOWED_VULNS) present. Continuing."
