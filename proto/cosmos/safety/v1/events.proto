syntax = "proto3";
package cosmos.safety.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmos/safety/v1/types.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/safety/types";

// EventTrip is emitted when the operator disables one or more patterns.
message EventTrip {
  // operator is the address that tripped the patterns.
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // patterns are the patterns added to the disabled list.
  repeated string patterns = 2;
}

// EventReset is emitted when one or more patterns are removed from the
// disabled list.
message EventReset {
  // sender is the address that reset the patterns.
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // patterns are the patterns removed from the disabled list.
  repeated string patterns = 2;
}

// EventParamsUpdated is emitted when the module params change.
message EventParamsUpdated {
  // authority is the address that updated the params.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params are the new module params.
  Params params = 2 [(gogoproto.nullable) = false];
}
