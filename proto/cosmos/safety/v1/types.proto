syntax = "proto3";
package cosmos.safety.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/safety/types";

// Params defines the parameters of the safety module.
message Params {
  option (amino.name) = "cosmos-sdk/x/safety/Params";

  // authority is the address that sets params and resets any disabled pattern.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // operator is the single address that may trip and reset patterns covered
  // by scope. An empty operator means no operator is configured.
  string operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // scope lists the patterns the operator may trip and reset. Each entry is
  // "*", a prefix pattern such as "/cosmos.bank.*", or an exact msg type URL.
  repeated string scope = 3;
}
